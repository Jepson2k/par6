name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PIXI_VERSION: v0.79.0

jobs:
  # Every crate builds and tests under one environment: pixi provides the C++
  # closure, `pixi run setup` builds toppra and the Pinocchio shim, and par6d
  # links that shim unconditionally — so there is no toolchain-free leg to
  # carve out and nothing to `--exclude`.
  rust:
    name: rust (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: default
      # Built once, cached on the lock: a comment edit in a script no longer
      # busts the whole toolchain.
      - name: cache shim + toppra
        uses: actions/cache@v4
        with:
          path: .ffi
          key: ffi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'Cargo.lock', 'cpp/**', 'scripts/ffi/*.sh') }}
      - name: build shim (pixi run setup)
        run: pixi run setup
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: pixi run cargo clippy --workspace --all-targets -- -D warnings
      # par6-py is a Python extension: its test harness would need a libpython
      # to link against. It is clippy-checked above and exercised by the
      # `python` job through the real import.
      - name: test
        run: pixi run cargo test --workspace --exclude par6-py
      # pinokin-sys is its OWN workspace, so `--workspace` never reaches it.
      - name: fmt + clippy + test (pinokin-sys)
        run: |
          cargo fmt --manifest-path crates/pinokin-sys/Cargo.toml --all --check
          pixi run cargo clippy --manifest-path crates/pinokin-sys/Cargo.toml \
            --all-targets --features ffi -- -D warnings
          pixi run cargo test --manifest-path crates/pinokin-sys/Cargo.toml --features ffi
      # The collision golden suite runs in `test` above; this reruns just its
      # timing case optimized and uncaptured, so the measured per-waypoint
      # cost the planner budgets against is visible in the log. The test only
      # fails on catastrophe, never on runner noise.
      - name: report collision check cost (par6-kin)
        run: |
          pixi run cargo test -p par6-kin --release --features ffi \
            --test golden_collision per_waypoint_check_cost_is_reported -- --nocapture
      # The shipped 250 Hz configuration, end to end: every other harness
      # patches tick_dt_s up for CI headroom, so this soak is the one place
      # the unpatched 0.004 runs before it meets the arm. Release because an
      # unoptimized RT loop cannot hold a 4 ms period anywhere (the test skips
      # itself in debug builds for the same reason).
      - name: shipped 250 Hz soak (par6d, release)
        run: pixi run cargo test -p par6d --release --test shipped_tick -- --nocapture

  # The pure-Rust crates cross-compile for the control box without any C++.
  # par6d's aarch64 build is the deploy build (deploy-aarch64 below), which
  # supplies the cross-compiled shim.
  cross-check:
    name: cross check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cross check
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --workspace --exclude par6d --exclude par6-py --target aarch64-unknown-linux-gnu

  msrv:
    # The env context is not available to jobs.<id>.name, and a workflow
    # using it there is invalid as a whole — every run of this file dies
    # at parse with zero jobs. The toolchain version shows in the job log.
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The declared rust-version had never been built, so nothing stopped
      # a newer-toolchain feature from landing and breaking the floor the
      # workspace advertises.
      - name: read MSRV from Cargo.toml
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: default
      - name: cache shim + toppra
        uses: actions/cache@v4
        with:
          path: .ffi
          key: ffi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'Cargo.lock', 'cpp/**', 'scripts/ffi/*.sh') }}
      - name: build shim (pixi run setup)
        run: pixi run setup
      - name: check
        run: pixi run cargo check --workspace --all-targets

  # The SocketCAN backend is the only bus that will ever touch the arm,
  # and its vcan suite skips itself wherever no vcan interface exists —
  # which used to be everywhere, CI included. GitHub's ubuntu runners
  # allow sudo, and the vcan module lives in linux-modules-extra (not in
  # the base image), so this job installs that package for the running
  # kernel, creates the interface, and runs the suite for real.
  # PAR6_REQUIRE_VCAN=1 turns the developer-default skip into a hard
  # failure: if interface creation ever breaks, the job goes red instead
  # of silently degrading to a no-op.
  socketcan:
    name: socketcan (vcan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: socketcan
      - name: create vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
      # Single-threaded: every test in the binary opens observer sockets on
      # the same vcan0 and asserts exact frame sequences, so concurrent
      # tests would see each other's traffic.
      - name: test par6-bus against vcan0
        env:
          PAR6_REQUIRE_VCAN: '1'
        run: cargo test -p par6-bus --test socketcan_vcan -- --test-threads=1 --nocapture

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            env: py311
          - python: '3.12'
            env: py312
    steps:
      - uses: actions/checkout@v4
      # The package is a maturin build: pip compiles the par6-py extension,
      # which links the pinocchio shim like every other crate, so this job
      # carries the same toolchain as `rust`. The interpreter comes from the
      # pixi environment for the matrix version.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: ${{ matrix.env }}
      - name: cache shim + toppra
        uses: actions/cache@v4
        with:
          path: .ffi
          key: ffi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'Cargo.lock', 'cpp/**', 'scripts/ffi/*.sh') }}
      - name: build shim (pixi run setup)
        run: pixi run -e ${{ matrix.env }} setup
      # waldoctl branch-matching must happen BEFORE the package install:
      # a cross-repo change lands on a branch of the same name first
      # (CLAUDE.md's dev workflow), and while the release chain is in
      # flight the pinned tag may not exist yet — a dead pin fails the
      # whole resolve. The pin is rewritten for this resolve only.
      - name: install (waldoctl branch-matched)
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          repo=https://github.com/Jepson2k/waldoctl.git
          matched=""
          if [ "$branch" != "main" ] && \
             git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
            echo "installing waldoctl from branch $branch"
            matched=1
            pixi run -e ${{ matrix.env }} pip install "waldoctl @ git+$repo@$branch"
            sed -i.bak "s#waldoctl.git@v[0-9.]*#waldoctl.git@${branch}#" python/pyproject.toml
          else
            echo "no waldoctl branch $branch; keeping the pinned tag"
          fi
          pixi run -e ${{ matrix.env }} pip install -e "python[dev]"
          if [ -n "$matched" ]; then
            mv python/pyproject.toml.bak python/pyproject.toml
          fi
      - name: pre-commit (ruff, ruff-format, ty, file hygiene)
        run: pixi run -e ${{ matrix.env }} pre-commit run --show-diff-on-failure --color=always --all-files
      # Under pixi at run time too: the extension dlopens the shim on import.
      - name: pytest
        run: cd python && pixi run -e ${{ matrix.env }} pytest

  # End-to-end: the real python client against a real `par6d --sim` process
  # over real UDP. Needs the binary, so it builds par6d here and points
  # PAR6D_BIN at it; without that the same tests skip themselves (which is
  # what happens in the `python` job above).
  e2e:
    name: e2e (python client <-> par6d --sim)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          environments: py312
      - name: cache shim + toppra
        uses: actions/cache@v4
        with:
          path: .ffi
          key: ffi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'Cargo.lock', 'cpp/**', 'scripts/ffi/*.sh') }}
      - name: build shim (pixi run setup)
        run: pixi run -e py312 setup
      # Release, not debug: the sim runs in wall-clock time and an
      # unoptimized RT loop misses its deadlines and latches LOOP_CRITICAL.
      - name: build par6d
        run: pixi run -e py312 cargo build -p par6d --release
      # Same branch-matching as the python job: the pinned waldoctl tag
      # may not exist while the release chain is in flight.
      - name: install python client (waldoctl branch-matched)
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          repo=https://github.com/Jepson2k/waldoctl.git
          matched=""
          if [ "$branch" != "main" ] && \
             git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
            matched=1
            pixi run -e py312 pip install "waldoctl @ git+$repo@$branch"
            sed -i.bak "s#waldoctl.git@v[0-9.]*#waldoctl.git@${branch}#" python/pyproject.toml
          fi
          pixi run -e py312 pip install -e "python[dev]"
          if [ -n "$matched" ]; then
            mv python/pyproject.toml.bak python/pyproject.toml
          fi
      # par6d embeds no rpath at all (cargo link-args do not propagate across
      # packages), so it needs the shim's directory as well as the prefix its
      # Pinocchio and coal live in — which is exactly what the pixi activation
      # provides, the same way for every job here.
      - name: pytest -m e2e
        env:
          PAR6D_BIN: ${{ github.workspace }}/target/release/par6d
          # This job exists to run the e2e layer. Without the flag a
          # missing binary would skip all of it and still report green.
          PAR6_REQUIRE_E2E: "1"
        run: |
          cd python
          pixi run -e py312 pytest -m e2e
          pixi run -e py312 pytest -m examples --examples

  # The artifact that actually deploys: par6d cross-built for the control
  # box WITH kinematics, plus the shim and the runtime closure that ship
  # beside it. Nothing here can be executed (the runner is x86_64), so the
  # job proves what is checkable statically — that the cross toolchain
  # resolves, the shim links, and the staged closure's symbol versions are
  # internally satisfiable at a glibc floor the box clears.
  #
  # Still on scripts/ffi/setup.sh: this is the one path pixi cannot replace
  # from an x86_64 host (it cannot materialise a foreign-platform prefix).
  deploy-aarch64:
    name: deploy artifact (aarch64, ffi)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: deploy-aarch64
      - name: cache aarch64 pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/cross-aarch64
          key: ffi-aarch64-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build aarch64 shim + runtime closure
        run: scripts/ffi/setup.sh --target aarch64
      - name: cross-build par6d
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/build-aarch64.sh
      # The deploy bundle is staged (not uploaded) so the packaging half of
      # install.sh is exercised too: a missing shim, config or assets tree
      # fails here rather than on the box.
      - name: stage the deploy bundle
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/install.sh --stage-only "$RUNNER_TEMP/bundle"
          test -x "$RUNNER_TEMP/bundle/par6d"
          test -f "$RUNNER_TEMP/bundle/lib/libpar6_shim.so"
          test -f "$RUNNER_TEMP/bundle/config/PAR6.toml"
          test -d "$RUNNER_TEMP/bundle/par6_description"
      # Tarred so the executable bit and the closure's symlinks survive
      # the artifact round-trip; `scp` + `tar -x` on the box is the whole
      # install.
      - name: pack the bundle
        run: tar -C "$RUNNER_TEMP" -czf par6d-aarch64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: par6d-aarch64-bundle
          path: par6d-aarch64.tar.gz
