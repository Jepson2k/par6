name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace
      - name: install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cross check (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

  ffi:
    name: ffi (pinocchio shim, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi
      - name: cache pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/env
            .ffi/shim
          key: ffi-toolchain-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build shim (scripts/ffi/setup.sh)
        run: scripts/ffi/setup.sh
      - name: clippy (ffi feature)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6-kin --all-targets --features ffi -- -D warnings
      - name: test par6-kin (golden kinematics fixtures)
        run: |
          source .ffi/env.sh
          cargo test -p par6-kin --features ffi
      # The collision golden suite runs in the step above; this one reruns
      # just its timing case optimized and uncaptured, so the measured
      # per-waypoint cost the planner budgets against is visible in the log.
      # The test only fails on catastrophe, never on runner noise.
      - name: report collision check cost (par6-kin)
        run: |
          source .ffi/env.sh
          cargo test -p par6-kin --release --features ffi \
            --test golden_collision per_waypoint_check_cost_is_reported -- --nocapture
      - name: test pinokin-sys (shim conformance)
        run: |
          source .ffi/env.sh
          cargo test --manifest-path crates/pinokin-sys/Cargo.toml --features ffi
      # sim-mujoco is off by default, so the workspace clippy/test jobs never
      # see this code; libmujoco comes from the same .ffi env as the shim.
      - name: test par6-bus (sim-mujoco contact plant)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6-bus --all-targets --features sim-mujoco -- -D warnings
          cargo test -p par6-bus --features sim-mujoco
      # The runtime's kinematics wiring (Kin-backed gravity/FK hooks, the
      # cartesian planner surface) lives behind `ffi`, so the workspace
      # clippy/test jobs never build it either.
      - name: test par6d (kinematics-backed runtime)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6d --all-targets --features ffi -- -D warnings
          cargo test -p par6d --features ffi

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e "python[dev]"
      - name: ruff
        run: ruff check python/
      - name: pytest
        working-directory: python
        run: pytest

  # End-to-end: the real python client against a real `par6d --sim` process
  # over real UDP. Needs the binary, so it builds par6d here and points
  # PAR6D_BIN at it; without that the same tests skip themselves (which is
  # what happens in the `python` job above).
  e2e:
    name: e2e (python client <-> par6d --sim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # Release, not debug: the sim runs in wall-clock time and an
      # unoptimized RT loop misses its deadlines and latches LOOP_CRITICAL.
      - name: build par6d
        run: cargo build -p par6d --release
      - name: install python client
        run: pip install -e "python[dev]"
      - name: pytest -m e2e
        working-directory: python
        env:
          PAR6D_BIN: ${{ github.workspace }}/target/release/par6d
        run: pytest -m e2e
