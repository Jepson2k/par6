# ARM64 is the primary platform: the arm ships on a Raspberry Pi 5, so the
# full suite runs on aarch64 runners and x86_64 is the compatibility check a
# developer's laptop needs. Every step is a pixi task, so a red job is
# reproduced locally with the command in its `run:` line.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupts. main is exempt: its runs are
# what the release job requires by commit SHA.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and toolchain-only: no pixi solve, no C++, no cargo build. Every
  # expensive job waits on it, so a formatting slip costs one runner-minute
  # rather than the whole matrix.
  fmt:
    name: fmt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The primary leg: everything the arm runs, built once and tested on the
  # architecture it runs on. vcan is created here rather than in a job of
  # its own — the suite that needs it is part of `cargo test`
  # and skips itself without the interface, so a separate job bought a
  # second machine and a second build of the whole workspace to run five
  # lines of modprobe.
  rust:
    name: rust (aarch64)
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          cache-key: default
      # PAR6_REQUIRE_VCAN turns the developer-default skip into a hard
      # failure: if creation ever breaks this goes red instead of quietly
      # dropping the SocketCAN backend's only real-transport coverage. The
      # module is not in the runner image.
      - name: create vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
      - run: pixi run clippy
      - env:
          PAR6_REQUIRE_VCAN: '1'
        run: pixi run test-rust
      - run: pixi run test-collision-cost
      - run: pixi run test-timing
      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-aarch64-logs
          path: |
            test-results.xml
            target/**/*.log
          if-no-files-found: ignore

  # The compatibility check. A developer's machine is x86_64, so the
  # workspace has to build and its logic-level tests pass there — the
  # timing soak and the packaging legs belong to the platform that ships.
  rust-x86:
    name: rust (x86_64, compat)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          cache-key: default
      - run: pixi run clippy
      - run: pixi run test-rust

  msrv:
    name: msrv
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The declared rust-version had never been built, so nothing stopped a
      # newer-toolchain feature from landing and breaking the floor the
      # workspace advertises. Read here because the env context is not
      # available to jobs.<id>.name.
      - name: read MSRV from Cargo.toml
        run: echo "MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/pixi
        with:
          rust-toolchain: ${{ env.MSRV }}
          cache-key: msrv
      - run: pixi run cargo check --all-targets

  # Both interpreters in one job. `par6-py` is an abi3-py310 extension, so
  # the compiled half is identical for 3.11 and 3.12 — a matrix here spent a
  # second machine and a second build of the workspace to run the same
  # tests against a different pure-python interpreter.
  python:
    name: python (3.11, 3.12)
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          environments: default py311
          cache-key: default
      - uses: ./.github/actions/waldoctl-branch
        with:
          environment: default
      - run: pixi run lint-python
      - run: pixi run test-python
      - uses: ./.github/actions/waldoctl-branch
        with:
          environment: py311
      - run: pixi run -e py311 test-python
      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python
          path: python/test-results.xml
          if-no-files-found: ignore

  # The e2e layers and the release artifacts share a job because they share
  # the expensive thing: one release build of par6d. Splitting them made
  # three machines build it.
  bundle-arm64:
    name: e2e + bundle (aarch64)
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          cache-key: default
      - uses: ./.github/actions/waldoctl-branch
        with:
          environment: default
      - name: e2e
        env:
          PAR6D_BIN: ${{ github.workspace }}/target/release/par6d
          # Without the flag a missing binary would skip the whole layer
          # and still report green.
          PAR6_REQUIRE_E2E: '1'
        run: |
          pixi run test-e2e
          pixi run test-examples
      # The wheel first: pack-bundle writes the checksums over everything in
      # dist/, and a wheel built after it would not be covered.
      - run: pixi run wheel
      - run: pixi run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: par6-aarch64
          path: |
            dist/*.whl
            dist/par6d-aarch64.tar.gz
            dist/manifest.json
            dist/SHA256SUMS
      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: python/test-results.xml
          if-no-files-found: ignore

  validate-arm64:
    name: validate (aarch64)
    needs: bundle-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: par6-aarch64
          path: dist
      # Deliberately no pixi, no rustup, no .ffi and no LD_LIBRARY_PATH: the
      # artifacts have to carry their own closure or this fails.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: scripts/deploy/validate-bundle.sh dist
      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-aarch64-logs
          path: /tmp/par6-validate/**
          if-no-files-found: ignore
