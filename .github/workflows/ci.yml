# ARM64 is the primary platform: the arm ships on a Raspberry Pi 5, so the
# full suite runs on aarch64 runners and x86_64 is the compatibility check a
# developer's laptop needs. Every step is a pixi task, so a red job is
# reproduced locally with the command in its `run:` line.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupts. main is exempt: its runs are
# what the release job requires by commit SHA.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and toolchain-only: no pixi solve, no C++, no cargo build. Every
  # expensive job waits on it, so a formatting slip costs one runner-minute
  # rather than the whole matrix.
  fmt:
    name: fmt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The primary leg. Everything the arm runs is built and tested here, on
  # the architecture it runs on.
  rust:
    name: rust (aarch64)
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          cache-key: rust
      - run: pixi run clippy
      - run: pixi run test-rust
      - run: pixi run test-collision-cost
      - run: pixi run test-timing
      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-aarch64-logs
          path: |
            test-results.xml
            target/**/*.log
          if-no-files-found: ignore

  # The compatibility check. A developer's machine is x86_64, so the
  # workspace has to build and its logic-level tests pass there — but the
  # timing soaks and the packaging legs belong to the platform that ships.
  rust-x86:
    name: rust (x86_64, compat)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          cache-key: rust-x86
      - run: pixi run clippy
      - run: pixi run test-rust

  msrv:
    name: msrv
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The declared rust-version had never been built, so nothing stopped a
      # newer-toolchain feature from landing and breaking the floor the
      # workspace advertises. Read here because the env context is not
      # available to jobs.<id>.name.
      - name: read MSRV from Cargo.toml
        run: echo "MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/pixi
        with:
          rust-toolchain: ${{ env.MSRV }}
          cache-key: msrv
      - run: pixi run cargo check --all-targets

  # The SocketCAN backend's only real-transport coverage. The vcan module is
  # not in the runner image, and PAR6_REQUIRE_VCAN turns the developer-default
  # skip into a hard failure so a broken interface goes red instead of
  # quietly dropping the suite.
  socketcan:
    name: socketcan (vcan)
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          cache-key: socketcan
      - name: create vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
      - env:
          PAR6_REQUIRE_VCAN: '1'
        run: pixi run cargo test -p par6-bus --test socketcan_vcan

  python:
    name: python ${{ matrix.python }}
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            env: py311
          - python: '3.12'
            env: py312
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          environments: ${{ matrix.env }}
          cache-key: python-${{ matrix.env }}
      - uses: ./.github/actions/waldoctl-branch
        with:
          environment: ${{ matrix.env }}
      - run: pixi run -e ${{ matrix.env }} lint-python
      - run: pixi run -e ${{ matrix.env }} test-python
      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.env }}
          path: python/test-results.xml
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.layer }})
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: client
            task: test-e2e
          - layer: examples
            task: test-examples
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          environments: py312
          cache-key: e2e
      - uses: ./.github/actions/waldoctl-branch
        with:
          environment: py312
      - env:
          PAR6D_BIN: ${{ github.workspace }}/target/release/par6d
          # This job exists to run the e2e layer: without the flag a missing
          # binary would skip all of it and still report green.
          PAR6_REQUIRE_E2E: '1'
        run: pixi run -e py312 ${{ matrix.task }}
      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-${{ matrix.layer }}
          path: python/test-results.xml
          if-no-files-found: ignore

  # The artifacts a release ships, built natively on the platform that runs
  # them. `validate-arm64` then installs them with none of this job's
  # environment present.
  bundle-arm64:
    name: bundle (aarch64)
    needs: fmt
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pixi
        with:
          environments: py312
          cache-key: bundle
      - run: pixi run -e py312 bundle
      - run: pixi run -e py312 wheel
      - uses: actions/upload-artifact@v4
        with:
          name: par6-aarch64
          path: |
            dist/*.whl
            dist/par6d-aarch64.tar.gz
            dist/manifest.json
            dist/SHA256SUMS

  validate-arm64:
    name: validate (aarch64)
    needs: bundle-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: par6-aarch64
          path: dist
      # Deliberately no pixi, no rustup, no .ffi and no LD_LIBRARY_PATH: the
      # artifacts have to carry their own closure or this fails.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: scripts/deploy/validate-bundle.sh dist
      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-aarch64-logs
          path: /tmp/par6-validate/**
          if-no-files-found: ignore

  # Retained until the native aarch64 bundle is shown to hold the control
  # box's glibc floor: `validate-arm64` measures that floor, and this job is
  # what the deploy path uses in the meantime.
  cross-aarch64:
    name: cross build (aarch64, legacy)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-aarch64
      - name: cache aarch64 pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/cross-aarch64
          key: ffi-aarch64-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**', 'crates/*/build.rs') }}
      - name: build aarch64 shim + runtime closure
        run: scripts/ffi/setup.sh --target aarch64
      - name: cross-build par6d
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/build-aarch64.sh
      - name: stage the deploy bundle
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/install.sh --stage-only "$RUNNER_TEMP/bundle"
          test -x "$RUNNER_TEMP/bundle/par6d"
          test -f "$RUNNER_TEMP/bundle/lib/libpar6_shim.so"
          ls "$RUNNER_TEMP"/bundle/lib/libmujoco.so.*
          test -f "$RUNNER_TEMP/bundle/config/PAR6.toml"
          test -d "$RUNNER_TEMP/bundle/par6_description"
