name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo clippy --workspace --exclude par6d --exclude par6-py \
            --exclude par6-client --all-targets -- -D warnings
          # par6-client's LIBRARY is toolchain-free; only its tests boot a
          # daemon in-process (covered in `ffi`).
          cargo clippy -p par6-client -- -D warnings
      # par6d links the Pinocchio shim unconditionally, so it needs the C++
      # toolchain and is covered by the `ffi` job below (par6-py wraps it
      # and rides along). What this leg proves is that every LIBRARY crate
      # still builds and passes without that toolchain — which is what
      # keeps them usable on their own.
      - name: test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --exclude par6d --exclude par6-py --exclude par6-client
      # pinokin-sys is its OWN workspace (its ffi build needs the C++
      # toolchain), so `--workspace` above never reaches it — its
      # toolchain-free surface would otherwise be the one crate in the
      # tree with no fmt or clippy gate at all.
      - name: fmt + clippy (pinokin-sys)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --manifest-path crates/pinokin-sys/Cargo.toml --all --check
          cargo clippy --manifest-path crates/pinokin-sys/Cargo.toml \
            --all-targets -- -D warnings
      - name: install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      # par6d's aarch64 build is the deploy build and lives in
      # scripts/deploy/build-aarch64.sh, which supplies the cross-compiled
      # shim; this leg only cross-checks the toolchain-free crates.
      - name: cross check (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --workspace --exclude par6d --exclude par6-py --target aarch64-unknown-linux-gnu

  msrv:
    name: msrv (rust ${{ env.MSRV }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The declared rust-version had never been built, so nothing stopped
      # a newer-toolchain feature from landing and breaking the floor the
      # workspace advertises. par6d is excluded for the same reason as the
      # stable leg: it needs the C++ shim.
      - name: read MSRV from Cargo.toml
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: |
          cargo check --workspace --exclude par6d --exclude par6-py \
            --exclude par6-client --all-targets
          cargo check -p par6-client

  ffi:
    name: ffi (pinocchio shim, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi
      - name: cache pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/env
            .ffi/shim
          key: ffi-toolchain-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build shim (scripts/ffi/setup.sh)
        run: scripts/ffi/setup.sh
      - name: clippy (ffi feature)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6-kin --all-targets --features ffi -- -D warnings
      - name: test par6-kin (golden kinematics fixtures)
        run: |
          source .ffi/env.sh
          cargo test -p par6-kin --features ffi
      # The collision golden suite runs in the step above; this one reruns
      # just its timing case optimized and uncaptured, so the measured
      # per-waypoint cost the planner budgets against is visible in the log.
      # The test only fails on catastrophe, never on runner noise.
      - name: report collision check cost (par6-kin)
        run: |
          source .ffi/env.sh
          cargo test -p par6-kin --release --features ffi \
            --test golden_collision per_waypoint_check_cost_is_reported -- --nocapture
      - name: test pinokin-sys (shim conformance)
        run: |
          source .ffi/env.sh
          cargo test --manifest-path crates/pinokin-sys/Cargo.toml --features ffi
      # sim-mujoco is off by default, so the workspace clippy/test jobs never
      # see this code; libmujoco comes from the same .ffi env as the shim.
      - name: test par6-bus (sim-mujoco contact plant)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6-bus --all-targets --features sim-mujoco -- -D warnings
          cargo test -p par6-bus --features sim-mujoco
      # sim-dynamics (Pinocchio ABA torque-level plant) is the other
      # optional sim tier; it builds against the same shim as sim-mujoco
      # but had no CI job at all, so its code only ever compiled on a
      # developer box that happened to enable it.
      - name: test par6-bus (sim-dynamics torque plant)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6-bus --all-targets --features sim-dynamics -- -D warnings
          cargo test -p par6-bus --features sim-dynamics
      # `ffi` is the shipped configuration, so this is where par6d's whole
      # protocol-plane suite runs against the runtime that actually ships.
      - name: test par6d (the shipped runtime)
        run: |
          source .ffi/env.sh
          cargo clippy -p par6d -p par6-py -p par6-client --all-targets -- -D warnings
          cargo test -p par6d
          cargo test -p par6-client
      # The shipped 250 Hz configuration, end to end: every other harness
      # patches tick_dt_s up for CI headroom, so this soak is the one place
      # the unpatched 0.004 runs before it meets the arm. Release because
      # an unoptimized RT loop cannot hold a 4 ms period anywhere (the test
      # skips itself in debug builds for the same reason).
      - name: shipped 250 Hz soak (par6d, release)
        run: |
          source .ffi/env.sh
          cargo test -p par6d --release --test shipped_tick -- --nocapture

  # The SocketCAN backend is the only bus that will ever touch the arm,
  # and its vcan suite skips itself wherever no vcan interface exists —
  # which used to be everywhere, CI included. GitHub's ubuntu runners
  # allow sudo, and the vcan module lives in linux-modules-extra (not in
  # the base image), so this job installs that package for the running
  # kernel, creates the interface, and runs the suite for real.
  # PAR6_REQUIRE_VCAN=1 turns the developer-default skip into a hard
  # failure: if interface creation ever breaks, the job goes red instead
  # of silently degrading to a no-op.
  socketcan:
    name: socketcan (vcan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: socketcan
      - name: create vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
      # Single-threaded: every test in the binary opens observer sockets on
      # the same vcan0 and asserts exact frame sequences, so concurrent
      # tests would see each other's traffic.
      - name: test par6-bus against vcan0
        env:
          PAR6_REQUIRE_VCAN: '1'
        run: cargo test -p par6-bus --test socketcan_vcan -- --test-threads=1 --nocapture

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The package is a maturin build now: pip compiles the par6-py
      # extension, which links the pinocchio shim like every other crate,
      # so this job carries the same toolchain (and cache key) as `ffi`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: cache pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/env
            .ffi/shim
          key: ffi-toolchain-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build shim (scripts/ffi/setup.sh)
        run: scripts/ffi/setup.sh
      - name: install
        run: |
          source .ffi/env.sh
          pip install -e "python[dev]"
      # waldoctl is pinned to a tag, but a cross-repo change lands on a
      # branch of the same name first (CLAUDE.md's dev workflow), and the
      # type gate below is what notices when the two sides disagree.
      - name: use a matching waldoctl branch, if one exists
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          repo=https://github.com/Jepson2k/waldoctl.git
          if git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
            echo "installing waldoctl from branch $branch"
            pip install --force-reinstall --no-deps "waldoctl @ git+$repo@$branch"
          else
            echo "no waldoctl branch $branch; keeping the pinned tag"
          fi
      - name: ruff
        run: ruff check python/
      - name: ty
        working-directory: python
        run: ty check .
      # env.sh at run time too: the extension dlopens the shim on import.
      - name: pytest
        run: |
          source .ffi/env.sh
          cd python
          pytest

  # End-to-end: the real python client against a real `par6d --sim` process
  # over real UDP. Needs the binary, so it builds par6d here and points
  # PAR6D_BIN at it; without that the same tests skip themselves (which is
  # what happens in the `python` job above).
  e2e:
    name: e2e (python client <-> par6d --sim)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # `--features ffi` needs the shim, so this job carries the same
      # toolchain (and the same cache key) as the `ffi` job.
      - name: cache pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/env
            .ffi/shim
          key: ffi-toolchain-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build shim (scripts/ffi/setup.sh)
        run: scripts/ffi/setup.sh
      # Release, not debug: the sim runs in wall-clock time and an
      # unoptimized RT loop misses its deadlines and latches LOOP_CRITICAL.
      # par6d links the shim unconditionally, so this job needs it built.
      - name: build par6d
        run: |
          source .ffi/env.sh
          cargo build -p par6d --release
      - name: install python client
        run: |
          source .ffi/env.sh
          pip install -e "python[dev]"
      - name: pytest -m e2e
        env:
          PAR6D_BIN: ${{ github.workspace }}/target/release/par6d
          # This job exists to run the e2e layer. Without the flag a
          # missing binary would skip all of it and still report green.
          PAR6_REQUIRE_E2E: "1"
        # Sourced, not hand-listed: par6d embeds no rpath at all (cargo
        # link-args do not propagate across packages), so it needs the
        # shim's own directory as well as the conda prefix its Pinocchio
        # and coal live in. env.sh is what setup.sh generates and what
        # every other job here uses; a second hand-maintained copy of the
        # list is what silently dropped .ffi/shim/lib and left every e2e
        # test erroring on a missing libpar6_shim.so.
        run: |
          source .ffi/env.sh
          cd python
          pytest -m e2e
          pytest -m examples --examples

  # The artifact that actually deploys: par6d cross-built for the control
  # box WITH kinematics, plus the shim and the runtime closure that ship
  # beside it. Nothing here can be executed (the runner is x86_64), so the
  # job proves what is checkable statically — that the cross toolchain
  # resolves, the shim links, and the staged closure's symbol versions are
  # internally satisfiable at a glibc floor the box clears.
  deploy-aarch64:
    name: deploy artifact (aarch64, ffi)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: deploy-aarch64
      - name: cache aarch64 pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/cross-aarch64
          key: ffi-aarch64-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build aarch64 shim + runtime closure
        run: scripts/ffi/setup.sh --target aarch64
      - name: cross-build par6d
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/build-aarch64.sh
      # The deploy bundle is staged (not uploaded) so the packaging half of
      # install.sh is exercised too: a missing shim, config or assets tree
      # fails here rather than on the box.
      - name: stage the deploy bundle
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/install.sh --stage-only "$RUNNER_TEMP/bundle"
          test -x "$RUNNER_TEMP/bundle/par6d"
          test -f "$RUNNER_TEMP/bundle/lib/libpar6_shim.so"
          test -f "$RUNNER_TEMP/bundle/config/PAR6.toml"
          test -d "$RUNNER_TEMP/bundle/par6_description"
