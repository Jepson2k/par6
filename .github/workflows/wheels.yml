# Client wheels: the `par6` package with the compiled engine binding
# (crates/par6-py), one abi3 wheel per platform, installable with no Rust
# toolchain and no shim env. maturin's bundling grafts the whole
# Pinocchio/coal/TOPPRA closure into `par6.libs` (manylinux_2_39, the
# same floor pinokin ships at), which is what makes `pip install par6`
# self-contained.
#
# macOS and Windows legs wait on the shim toolchain: scripts/ffi/setup.sh
# only knows linux-64 and linux-aarch64 conda subdirs today.

name: wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  wheel:
    name: wheel (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
          - arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheel-${{ matrix.arch }}
      # Same shim caches as ci.yml's ffi / deploy-aarch64 jobs.
      - name: cache pinocchio toolchain (host)
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/env
            .ffi/shim
          key: ffi-toolchain-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: cache pinocchio toolchain (aarch64)
        if: matrix.arch == 'aarch64'
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/cross-aarch64
          key: ffi-aarch64-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build shim
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            scripts/ffi/setup.sh --target aarch64
          else
            scripts/ffi/setup.sh
          fi
      - name: build wheel
        run: |
          pip install "maturin>=1.7,<2" patchelf
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            source .ffi/env-aarch64.sh
          else
            source .ffi/env.sh
          fi
          cd python
          maturin build --release --target ${{ matrix.rust-target }} -o ../dist
      # The whole point of the wheel: it imports with no shim env, no
      # LD_LIBRARY_PATH, no Rust toolchain. A foreign-arch wheel cannot
      # run here, so only the host leg smokes.
      - name: smoke test (clean venv, no shim env)
        if: matrix.arch == 'x86_64'
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/par6-*.whl
          env -i /tmp/wheel-smoke/bin/python -c "
          from par6._par6 import ping_blocking, make_wire_error, NUM_JOINTS
          import par6
          assert NUM_JOINTS == 6
          assert make_wire_error(43, {'detail': 'x'})[1] == 43
          print('wheel imports self-contained:', par6.__version__)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/*.whl

  # The daemon half of a release: par6d cross-built for the control box,
  # with the shim, the runtime closure, config and assets staged by
  # scripts/deploy/install.sh — the same bundle ci.yml stages, packed as
  # a tarball a box installs with `tar -x`.
  daemon-bundle:
    name: daemon bundle (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: deploy-aarch64
      - name: cache aarch64 pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            .ffi/bin
            .ffi/cross-aarch64
          key: ffi-aarch64-${{ runner.os }}-${{ hashFiles('scripts/ffi/setup.sh', 'cpp/**') }}
      - name: build aarch64 shim + runtime closure
        run: scripts/ffi/setup.sh --target aarch64
      - name: cross-build par6d
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/build-aarch64.sh
      - name: stage and pack the bundle
        run: |
          source .ffi/env-aarch64.sh
          scripts/deploy/install.sh --stage-only "$RUNNER_TEMP/bundle"
          test -x "$RUNNER_TEMP/bundle/par6d"
          mkdir -p dist-bundle
          tar -C "$RUNNER_TEMP" -czf dist-bundle/par6d-aarch64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: par6d-aarch64-bundle
          path: dist-bundle/par6d-aarch64.tar.gz

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build sdist
        run: |
          pip install "maturin>=1.7,<2"
          cd python
          maturin sdist -o ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist, daemon-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
