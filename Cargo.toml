[workspace]
resolver = "2"
members = [
    "crates/par6-proto",
    "crates/par6-config",
    "crates/par6-kin",
    "crates/par6-motion",
    "crates/par6-bus",
    "crates/par6-rt",
    "crates/par6-server",
    "crates/par6-client",
    "crates/par6d",
    "crates/par6-py",
    "crates/pinokin-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jepson2k/par6"
# Verified by the `msrv` CI job, not asserted. mujoco-rs 6 sets the floor
# (edition 2024, rust-version 1.95); before it, rsruckig 3.0's use of
# `is_multiple_of` needed 1.87.
rust-version = "1.95"

[workspace.dependencies]
par6-proto = { path = "crates/par6-proto" }
par6-config = { path = "crates/par6-config" }
par6-kin = { path = "crates/par6-kin" }
pinokin-sys = { path = "crates/pinokin-sys" }
par6-motion = { path = "crates/par6-motion" }
par6-bus = { path = "crates/par6-bus" }
par6-rt = { path = "crates/par6-rt" }
par6-server = { path = "crates/par6-server" }
# The simulator's physics. `auto-download-mujoco` fetches the libmujoco matching
# the target arch into $MUJOCO_DOWNLOAD_DIR (pixi sets it); no system libmujoco.
mujoco-rs = { version = "6.0.0", default-features = false, features = ["auto-download-mujoco"] }
par6-client = { path = "crates/par6-client" }

serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
socketcan = "3.6"
socket2 = "0.6"
thread-priority = "3"
rsruckig = "3"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.package.par6d]
debug = true
