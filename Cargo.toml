[workspace]
resolver = "2"
members = [
    "crates/par6-proto",
    "crates/par6-config",
    "crates/par6-kin",
    "crates/par6-motion",
    "crates/par6-bus",
    "crates/par6-rt",
    "crates/par6-server",
    "crates/par6-client",
    "crates/par6d",
    "crates/par6-py",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Jepson2k/par6"
# Verified by the `msrv` CI job, not asserted. mujoco-rs 6 sets the floor
# (edition 2024, rust-version 1.95); before it, rsruckig 3.0's use of
# `is_multiple_of` needed 1.87.
rust-version = "1.95"

[workspace.dependencies]
# The simulator's physics: bindings only. libmujoco comes from the same
# conda prefix as Pinocchio and coal (pixi.lock), named by
# $MUJOCO_DYNAMIC_LINK_DIR, rather than from this crate's own downloader —
# one provider for the whole C++ closure, and one that cross-installs.
# The `+mj-3.12.0` build metadata is the libmujoco version it is generated
# against; pixi.toml's libmujoco pin must match it.
mujoco-rs = { version = "6.0.0", default-features = false }
par6-proto = { path = "crates/par6-proto" }
par6-config = { path = "crates/par6-config" }
par6-kin = { path = "crates/par6-kin" }
par6-motion = { path = "crates/par6-motion" }
par6-bus = { path = "crates/par6-bus" }
par6-rt = { path = "crates/par6-rt" }
par6-server = { path = "crates/par6-server" }
par6-client = { path = "crates/par6-client" }

serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
socketcan = "3.6"
socket2 = "0.6"
thread-priority = "3"
rsruckig = "3"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.package.par6d]
debug = true
