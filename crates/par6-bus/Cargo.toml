[package]
name = "par6-bus"
description = "DriverBus trait, Spectral/STEPFOC CAN frame codec, SocketCAN backend, closed-loop sim backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Torque-level sim plant (Pinocchio ABA forward dynamics) for the sim
# backend. Requires the C++ shim: scripts/ffi/setup.sh, then
# `source .ffi/env.sh` before building. Without it the sim backend uses
# the pure-Rust kinematic plant and needs no C++ toolchain.
sim-dynamics = ["dep:pinokin-sys"]
# MuJoCo-backed sim plant (contacts, grasp scenarios) for the sim backend.
# Requires libmujoco: scripts/ffi/setup.sh installs it into .ffi/env, then
# `source .ffi/env.sh` before building (exports PAR6_MUJOCO_LIB_DIR).
sim-mujoco = []

[dependencies]
par6-config = { workspace = true }
pinokin-sys = { path = "../pinokin-sys", features = ["ffi"], optional = true }
socketcan = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Raw RTM_GETLINK xstats query (hw/xstats.rs): socketcan-rs exposes the
# CAN link state but not the cumulative controller counters.
libc = "0.2"
