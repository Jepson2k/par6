[package]
name = "par6-bus"
description = "DriverBus trait, Spectral/STEPFOC CAN frame codec, SocketCAN backend, closed-loop sim backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Both alternative sim plants ship on: the shim and libmujoco are hard
# prerequisites (`scripts/ffi/setup.sh`), so a plain `cargo test` covers
# the torque-level and contact plants rather than silently skipping them.
default = ["sim-dynamics", "sim-mujoco"]
# Torque-level sim plant (Pinocchio ABA forward dynamics).
sim-dynamics = ["dep:par6-kin"]
# MuJoCo-backed sim plant (contacts, grasp scenarios); links libmujoco from
# the same `.ffi` prefix as the shim (PAR6_MUJOCO_LIB_DIR).
sim-mujoco = []

[dependencies]
par6-config = { workspace = true }
par6-kin = { workspace = true, optional = true }
socketcan = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Raw RTM_GETLINK xstats query (hw/xstats.rs): socketcan-rs exposes the
# CAN link state but not the cumulative controller counters.
libc = "0.2"
