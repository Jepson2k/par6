[package]
name = "par6-bus"
description = "DriverBus trait, Spectral/STEPFOC CAN frame codec, SocketCAN backend, closed-loop sim backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "mujoco"

[dependencies]
par6-config = { workspace = true }
par6-proto = { workspace = true }
# URDF inertials for the MuJoCo scene (sim/scene.rs).
roxmltree = "0.21"
par6-kin = { workspace = true }
# The sim plant. mujoco-rs downloads libmujoco itself; build under
# `pixi run` so MUJOCO_DOWNLOAD_DIR is set.
mujoco-rs = { workspace = true }
socketcan = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Raw RTM_GETLINK xstats query (hw/xstats.rs): socketcan-rs exposes the
# CAN link state but not the cumulative controller counters.
libc = "0.2"
