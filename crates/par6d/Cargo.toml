[package]
name = "par6d"
description = "The runtime binary: config load, thread spawn/wiring. `par6d --sim` runs anywhere, including CI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Kinematics is not optional here. Without the Pinocchio C-ABI shim the
# TCP pose reads NaN, every cartesian command is refused, and the
# collision world is empty while `set_shapes` still answers success —
# all invisible to a client. The runtime linked those in unconditionally
# rather than serve that, so there is no feature to turn them off.
# Build the shim first: scripts/ffi/setup.sh, then `source .ffi/env.sh`.
# The library crates still build without any C++ toolchain.

[dependencies]
# The preview plans a payload estimation's wrist poses with the same planner.
par6-calibrate = { workspace = true }
par6-config = { workspace = true }
par6-proto = { workspace = true }
par6-motion = { workspace = true }
par6-bus = { workspace = true, features = ["sim-dynamics"] }
par6-rt = { workspace = true }
par6-server = { workspace = true }
par6-kin = { workspace = true, features = ["ffi"] }
pinokin-sys = { path = "../pinokin-sys", features = ["ffi"] }
tokio = { workspace = true }
thiserror = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
libc = "0.2"

[dev-dependencies]
par6-proto = { workspace = true }
par6-config = { workspace = true }
par6-client = { workspace = true }
env_logger = { workspace = true }
libc = "0.2"
