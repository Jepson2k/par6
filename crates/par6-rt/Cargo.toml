[package]
name = "par6-rt"
description = "RT core: tick loop, mode dispatch, homing FSM, error latching, e-stop/GPIO, state snapshots."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gpio"]
# The control box's physical ESTOP_1 line, through the Linux GPIO character
# device. ON by default: a hardware runtime that cannot read the button
# refuses to start, so shipping this off would ship an arm that never
# reacts to an e-stop. The dependency is Linux-only and pure Rust (it
# cross-compiles to aarch64 with no C toolchain), so a non-Linux host still
# builds with the feature nominally on and refuses hardware mode at startup.
gpio = ["dep:gpiocdev"]

[dependencies]
par6-config = { workspace = true }
par6-bus = { workspace = true }
thread-priority = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
libc = "0.2"

# Pure-Rust GPIO character device (uAPI v2), no C libgpiod to cross-compile.
[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = { version = "0.8", optional = true }
