[package]
name = "par6-rt"
description = "RT core: tick loop, mode dispatch, homing FSM, error latching, e-stop/GPIO, state snapshots."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Gravity via the Pinocchio FFI shim (pinokin-sys). Off by default so plain
# builds need no C++ toolchain; the zero-torque and test gravity models are
# always available.
ffi = ["dep:pinokin-sys"]

[dependencies]
par6-config = { workspace = true }
par6-bus = { workspace = true }
pinokin-sys = { path = "../pinokin-sys", features = ["ffi"], optional = true }
thread-priority = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
libc = "0.2"
