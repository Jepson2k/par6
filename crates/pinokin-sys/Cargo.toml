[package]
name = "pinokin-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jepson2k/par6"
description = "Raw FFI + minimal safe wrapper over the par6_shim C ABI (Pinocchio kinematics/dynamics)"
links = "par6_shim"
build = "build.rs"

[features]
default = []
# Link against the built C++ shim (requires scripts/ffi/setup.sh first and
# PAR6_SHIM_LIB_DIR in the environment). Without this feature the crate is an
# empty stub so plain `cargo check` works with no C++ toolchain present.
ffi = []

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone: intentionally NOT a member of the par6 root workspace — building
# it must not require the C++ deps that workspace CI lacks by default.
[workspace]
