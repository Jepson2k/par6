[package]
name = "par6-kin"
description = "Kinematics/dynamics/collision via Pinocchio + coal through the repo's C-ABI shim: fk, jacobian, gravity, analytic ik, collision world."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "par6_shim"
build = "build.rs"

[dependencies]
thiserror = { workspace = true }
# Collision only: turning decoded wire shapes into checkable ones, so the
# server's SET_SHAPES seam is one call rather than a hand-rolled match.
par6-proto = { workspace = true }
# Analytic (OPW) inverse kinematics. Parameters are derived from the URDF at
# load and checked against the Pinocchio FK, so IK needs no tuning and no
# hand-entered constants.
rs-opw-kinematics = { version = "2.0.3", default-features = false }
glam = "=0.30.10"
urdf-rs = "0.9"

[dev-dependencies]
# The vendor gravity reference is JSON.
serde = { workspace = true }
serde_json = "1"
