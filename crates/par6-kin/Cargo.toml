[package]
name = "par6-kin"
description = "Kinematics/dynamics via Pinocchio FFI (pinokin C-ABI shim): fk, jacobian, gravity, ik. Later: coal collision."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Safe wrapper over the Pinocchio C++ shim (pinokin-sys). Off by default so
# `cargo build --workspace` needs no C++ toolchain: run scripts/ffi/setup.sh,
# `source .ffi/env.sh`, then build/test with `--features ffi`.
ffi = ["dep:pinokin-sys", "dep:thiserror"]

[dependencies]
thiserror = { workspace = true, optional = true }
pinokin-sys = { path = "../pinokin-sys", features = ["ffi"], optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = "1"
