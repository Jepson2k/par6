[package]
name = "par6-proto"
description = "Protocol v2: command/reply/status codec, enums, error catalog. Single source of truth; python mirror is generated."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The codec is hand-rolled msgpack: every payload is a positional array with an
# integer tag in slot 0 and heterogeneous fields after it, which serde's derive
# model cannot express (and byte-exact golden vectors demand full control over
# integer/float widths anyway). serde_json is used only by the golden-vector /
# python-mirror generators and their freshness-guard tests.
[dependencies]
thiserror = { workspace = true }
serde_json = "1"

[[bin]]
name = "gen_python"
path = "src/bin/gen_python.rs"

[[bin]]
name = "gen_golden"
path = "src/bin/gen_golden.rs"
