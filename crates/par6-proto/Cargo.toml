[package]
name = "par6-proto"
description = "Protocol v2: command/reply/status codec, enums, error catalog. Single source of truth; python mirror is generated."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The codec is hand-rolled msgpack: every payload is a positional array with an
# integer tag in slot 0 and heterogeneous fields after it, which serde's derive
# model cannot express, and the wire demands full control over integer/float
# widths anyway.
[dependencies]
thiserror = { workspace = true }
# Commands arrive from the Python binding as dicts; deriving the
# deserialization keeps one description of each command instead of a
# hand-written dict reader that has to be updated alongside it.
serde = { workspace = true }

[[bin]]
name = "gen_python"
path = "src/bin/gen_python.rs"
