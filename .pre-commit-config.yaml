# `pre-commit install` wires both stages: clippy is a pre-push hook because
# it costs ~27 s warm even with nothing to do, which is not a per-commit price.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (workspace)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: \.(rs|toml)$
        pass_filenames: false
        stages: [pre-push]

  # Ruff for Python linting and formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^python/
      - id: ruff-format
        files: ^python/

  # ty for static type checking
  - repo: local
    hooks:
      - id: ty
        name: ty (par6 python)
        entry: bash -c 'cd python && ty check .'
        language: system
        files: ^python/
        pass_filenames: false

  # Built-in hooks for file quality. The asset trees and the packaged data
  # are vendored copies — they may not be "fixed".
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(assets/|python/par6/_data/|crates/par6-bus/sim-assets/)
      - id: end-of-file-fixer
        exclude: ^(assets/|python/par6/_data/|crates/par6-bus/sim-assets/)
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^(assets/|Cargo\.lock)
      - id: check-merge-conflict
