[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "par6"
version = "0.2.0"
description = "PAR6 robot backend for Waldo Commander: waldoctl client for the par6d Rust runtime"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.5",
  "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@v0.12.0",
]

[project.scripts]
par6 = "par6.cli:main"
par6-panel = "par6.panel.service:main"
par6-preflight = "par6.panel.preflight:main"

[project.optional-dependencies]
# ruff is pinned: it was unpinned and unconfigured, so CI installed whatever
# was newest and linted against that version's default rule set while devs ran
# an older one — every push was red on rules the code had never been checked
# against. The pin and the explicit `select` below are what make the two agree.
# pyserial is here so `serial` resolves for the type checker: the panel's
# other optional imports (board, busio, adafruit, gpiozero) need real
# hardware wheels and carry `ty: ignore`, but a muted pyserial would be an
# ignore that is used on CI and unused on any box that has it — a gate that
# passes or fails on what happens to be installed.
dev = ["ruff==0.15.8", "ty", "pre-commit", "pytest", "pytest-asyncio", "pytest-timeout", "pillow", "pyserial"]
# The control box front panel (`par6-panel`, `par6-preflight`): PIL draws the
# OLED frames, gpiozero owns the buttons and LEDs, the Adafruit driver talks
# to the SSD1306 over I2C, pyserial to the mainboard PCB.
panel = ["pillow", "gpiozero", "adafruit-circuitpython-ssd1306", "pyserial"]

[project.entry-points."waldoctl.robots"]
par6 = "par6.robot:Robot"

[tool.maturin]
# The extension crate (the engine binding); the pure-Python shim package
# lives right here and is bundled alongside it. `par6/_data` (runtime
# config + URDF trees mirrored by scripts/sync_pkg_data.py) rides along as
# ordinary package files.
manifest-path = "../crates/par6-py/Cargo.toml"
python-source = "."
module-name = "par6._par6"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit, not inherited: ruff's defaults change between releases, and an
# inherited set silently re-lints the whole package on every upgrade.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra --junitxml=test-results.xml"
timeout = 45
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "e2e: drives a live `par6d --sim` process over real UDP (skipped without the binary)",
  "slow: runs a full simulated sequence in wall-clock time (tens of seconds)",
  "examples: runs an examples/ script end to end (opt in with --examples)",
]
