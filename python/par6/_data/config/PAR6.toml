# ============================================================ homing (per-joint)
# From robots/PAR6.xml homing_* fields. The vendor encodes "no release phase"
# as homing_release_duration_s = NaN; here the [release] table is simply
# omitted (its current_ma/sample_pct then have no meaning and are dropped).

[[homing.joints]] # J0
strategy = "stall"
speed_ticks_s = 4500.0
direction = 0
current_ma = 700.0
timeout_s = 13.0
backoff_s = 0.3
two_pass = true
two_pass_max_diff_ticks = 3500
home_offset_rad = 2.96279
home_offset_gripper_dependent = false

[[homing.joints]] # J1
strategy = "stall"
speed_ticks_s = 6000.0
direction = 1
current_ma = 250.0
timeout_s = 10.0
backoff_s = 1.5
two_pass = true
two_pass_max_diff_ticks = 2000
home_offset_rad = -2.5259796
home_offset_gripper_dependent = false

[homing.joints.release]
current_ma = 150.0
duration_s = 1.0
sample_pct = 0.8

[[homing.joints]] # J2
strategy = "stall"
speed_ticks_s = 6000.0
direction = 0
current_ma = 250.0
timeout_s = 10.0
backoff_s = 1.5
two_pass = true
two_pass_max_diff_ticks = 1500
home_offset_rad = 1.90859
home_offset_gripper_dependent = false

[homing.joints.release]
current_ma = -150.0
duration_s = 1.0
sample_pct = 0.8

[[homing.joints]] # J3 — homes against the gripper body; offset is a fallback
strategy = "stall"
speed_ticks_s = 13500.0
direction = 0
current_ma = 1200.0
timeout_s = 10.0
backoff_s = 0.3
two_pass = true
two_pass_max_diff_ticks = 1500
home_offset_rad = -2.717
home_offset_gripper_dependent = true

# J4's release current (+1500 below) shares the sign of its approach
# drive (direction = 0), unlike J1/J2 whose releases oppose the approach
# and relax the gearbox. Vendor-verbatim (robots/PAR6.xml), so it ships
# as-is — but it means the release presses toward the stop in any plant
# that reads the sign literally. Verify the real behavior at HIL
# bring-up (CODE-REVIEW.md §5.3) before trusting J4's home windup.
[[homing.joints]] # J4 — gripper-dependent; every shipped gripper overrides it
strategy = "stall"
speed_ticks_s = 13500.0
direction = 0
current_ma = 1200.0
timeout_s = 10.0
backoff_s = 0.3
two_pass = true
two_pass_max_diff_ticks = 1500
home_offset_rad = 0.0
home_offset_gripper_dependent = true

[homing.joints.release]
current_ma = 1500.0
duration_s = 1.5
sample_pct = 0.8

[[homing.joints]] # J5 — hall sensor: single pass, no release
strategy = "hall"
speed_ticks_s = 12000.0
direction = 0
current_ma = 800.0
timeout_s = 15.0
backoff_s = 0.3
two_pass = false
two_pass_max_diff_ticks = 1500
home_offset_rad = 1.86159
home_offset_gripper_dependent = false

# ============================================================ homing sequence
# From config/PAR6_homing.xml, step for step.

# Home J0 while J1/J2 hold idle and J4 nudges clear.
[[homing.sequence]]
pre_moves = [
    { kind = "idle", joint = 1, duration_s = 4.0 },
    { kind = "idle", joint = 2, duration_s = 4.0 },
    { kind = "nudge", joint = 4, speed_ticks_s = -7000.0, duration_s = 2.8 },
]

[homing.sequence.home]
joints = [0]

# Home J1 + J2 in parallel.
[[homing.sequence]]
[homing.sequence.home]
joints = [1, 2]

# Nudge J4 back.
[[homing.sequence]]
pre_moves = [{ kind = "nudge", joint = 4, speed_ticks_s = 5000.0, duration_s = 1.9 }]

# Gripper firmware calibration (built-in activation sequence).
[[homing.sequence]]
[homing.sequence.home]
gripper = "firmware"

# Gripper motor homing (stall-detect against the endstop).
[[homing.sequence]]
[homing.sequence.home]
gripper = "motor"

# Park the gripper jaws near closed.
[[homing.sequence]]
pre_moves = [
    { kind = "gripper_move", position = 252, speed = 150, current_ma = 500, activate = true, action = true, estop = false, release_dir = false, duration_s = 2.5 },
]

# Nudge J5 off its stop, then move J1/J2 to the mid pose.
[[homing.sequence]]
pre_moves = [{ kind = "nudge", joint = 5, speed_ticks_s = -9000.0, duration_s = 1.8 }]
move_to = [
    { joint = 1, position_rad = -1.85, duration_s = 2.5 },
    { joint = 2, position_rad = 2.85, duration_s = 2.5 },
]

# Home J3 + J5 in parallel.
[[homing.sequence]]
[homing.sequence.home]
joints = [3, 5]

# Move J5 to pi.
[[homing.sequence]]
move_to = [{ joint = 5, position_rad = 3.141592654, duration_s = 2.0 }]

# Home J4.
[[homing.sequence]]
[homing.sequence.home]
joints = [4]

# Final ready pose.
[[homing.sequence]]
move_to = [
    { joint = 0, position_rad = 1.57, duration_s = 3.0 },
    { joint = 3, position_rad = 0.0, duration_s = 3.0 },
    { joint = 4, position_rad = -0.5, duration_s = 3.0 },
]

# ============================================================ bus (spec/CAN.md)
[bus]
interface = "can0"
bitrate = 1000000
restart_ms = 100
txqueuelen = 1000
sndbuf_bytes = 4194304
gripper_node = 6
timing_dummy_node = 13
host_node = 14
stale_warn_s = 0.04 # 10 ticks @ 250 Hz — stale WARNING, self-clears
lost_s = 0.2        # 50 ticks @ 250 Hz — disconnect ERROR, latched
rx_frames_per_tick_cap = 32
boot_config_repeats = 3
config_pace_s = 0.0005 # ~0.5 ms per message-type batch (TX queue drops on overflow)
watchdog_action = "idle"

[bus.kt_fetch]
timeout_s = 0.35
retries = 3
rounds = 2

[bus.scan]
rounds = 2
wait_s = 0.0025

# ================================================ protocol (spec/PROTOCOL-V2.md)
# Only the :6001 command port is fixed by the spec; the rest are our defaults,
# env-overridable at runtime (PAR6_* namespace).
[protocol]
command_port = 6001
status_port = 6002
status_multicast_group = "239.255.0.71"
telemetry_port = 6003
status_rate_hz = 50 # must divide the 250 Hz tick rate

# ==================================================== mode defaults (system.xml)
[jog]
speed_pct = 0.2
accel_time_s = 0.55
profile = "scurve"
jerk_factor = 3.0
control_mode = "pid"

[stream]
command_timeout_s = 0.04
stopping_hold_s = 0.5
start_pose_tol_rad = 0.1
lowpass_cutoff_hz = 0.0
success_window_s = 0.4 # 100 ticks @ 250 Hz
success_warn = 0.95
success_bad = 0.9

# ============================================= installation keep-outs (issue #19)
# Standing collision restrictions of THIS installation — cage walls, the
# table, fixtures — enforced from boot in the planner's collision gate AND
# the streaming (jog/servo) gate. The wire's `set_shapes` replaces the
# PROGRAM layer only, so nothing a client sends can remove these; the
# SHAPES query reads them back as the `installation` list.
#
# Units are metres and radians. `pose` is [x, y, z, rx, ry, rz] with
# extrinsic-XYZ rotation (angles about fixed world axes, R = Rz*Ry*Rx) —
# the waldoctl Shape.pose convention, NOT the TCP-pose readback one.
# `kind` is one of: box, sphere, cylinder, capsule, cone, ellipsoid,
# plane (prefer a box over a plane: an unbounded half-space costs the
# checker ~1000x per query). `params` are the primitive's constructor
# arguments in waldoctl field order (box: [x, y, z] full side lengths).
# Optional: `collision = false` (visual-only marker), `margin` (extra
# standoff in metres on top of the runtime's 5 mm clearance).
#
# Every entry is validated at startup through the same path a client
# `set_shapes` runs — a malformed shape refuses boot, naming the shape.
#
# Example (a table surface 10 cm below the robot base origin):
# [[installation_shapes]]
# name = "table"
# kind = "box"
# params = [0.8, 0.8, 0.02]
# pose = [0.3, 0.0, -0.11, 0.0, 0.0, 0.0]
