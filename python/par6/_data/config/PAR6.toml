# PAR6 robot configuration.
#
# Values transcribed from the vendor RCB-Runtime configs (facts only, no code):
#   robots/PAR6.xml        — joints, gains, limits, homing FSM parameters
#   config/PAR6_homing.xml — homing sequence steps
#   config/system.xml      — active gripper, kt source, jog/stream defaults
# Bus link parameters per spec/CAN.md. Protocol ports/rates are OUR choices
# (spec/PROTOCOL-V2.md fixes only the :6001 command port).
#
# Units: every time constant is SECONDS (converted round(s/dt) at runtime);
# motor quantities use wire units (encoder ticks, mA, mV, ms for the driver
# watchdog); joint quantities are rad-based SI.
#
# Angle convention: all joint angles here are the vendor motor convention
# (rcb-runtime theta), and the vendored URDFs/MJCFs are re-based to the SAME
# convention (assets/par6_description/CHANGELOG.md, issue #24) — these values
# feed the kinematics, collision and sim models verbatim, with no sign or
# offset mapping anywhere.

